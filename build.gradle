plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = "${mod_version}+${minecraft_version}"
group = project.maven_group

repositories {
	maven {
		name = 'Terraformers'
		url = 'https://maven.terraformersmc.com/releases/'
		content {
			includeGroup 'com.terraformersmc'
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"smallhands" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// Client game tests only run on demand (./gradlew runClientGameTest), not as part of build.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "smallhands-test"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	localRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"
	localRuntime "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	gametestImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}


processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}
