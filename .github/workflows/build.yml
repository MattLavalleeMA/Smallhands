name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      # Also validates the Gradle wrapper and caches dependencies.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Also compiles the client game test so it keeps building; it only runs on demand.
      - name: Build
        run: ./gradlew build compileGametestJava

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: smallhands
          path: build/libs/
          retention-days: 14
